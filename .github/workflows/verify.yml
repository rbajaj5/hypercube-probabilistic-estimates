name: verify

on:
  push:
  pull_request:

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run all verification checks
        shell: bash
        run: |
          set -euo pipefail
          for script in verification/verify_*.py; do
            echo "==> $script"
            python "$script"
          done
