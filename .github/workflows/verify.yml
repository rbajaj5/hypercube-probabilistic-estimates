name: verify

on:
  push:
  pull_request:

jobs:
  exact-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run hypercube hashing checks
        run: python verification/verify_affine_spectrum_hashing.py
      - name: Run projector matrix-hypercube checks
        run: python verification/verify_projector_matrix_hypercube.py
      - name: Run projector heavy-tail checks
        run: python verification/verify_projector_heavy_tails.py
      - name: Run small-deviation checks
        run: python verification/verify_low_dimensional_bounds.py
